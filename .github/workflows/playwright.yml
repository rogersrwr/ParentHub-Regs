name: Playwright Tests
on:
  workflow_dispatch:

env:
  ACCT_LOGIN: ${{ secrets.USERNAME }}
  ACCT_PASS: ${{ secrets.PASSWORD }}
  USER_DESKTOP: ${{ secrets.USER_DESKTOP }}
  PASS_DESKTOP: ${{ secrets.PASS_DESKTOP }}


permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  test:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Cache node_modules
      uses: actions/cache@v4
      id: node-modules-cache
      with:
        path: |
          node_modules
        key: modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      run: npm ci
    - name: Install Slack New
      run: npm install @slack/bolt
    - name: Install octokit
      run: npm i @octokit/core

    - name: Cache Playwright binaries
      uses: actions/cache@v4
      id: cache-playwright
      with:
        path: |
          C:\Users\runneradmin\AppData\Local\ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}
        enableCrossOsArchive: true
    - name: Install Playwright Browsers
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Run Playwright tests 
      run: npx playwright test --project=chromium --ignore-snapshots
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        overwrite: true
        retention-days: 7


    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: playwright-report/
        retention-days: 14

    - name: Setup Pages
      if: always()
      uses: actions/configure-pages@v5
    - name: Upload artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'playwright-report/'
    - name: Deploy to GitHub Pages
      if: always()
      id: deployment
      uses: actions/deploy-pages@v4